<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="description" content="CAMTRACK PRO - Professional CCTV Installation Management"/>
<title>CAMTRACK PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --ink:#0a0a0a;
  --paper:#f5f3ef;
  --red:#c0392b;
  --gold:#b8960c;
  --mid:#6b6b6b;
  --border:#d0cdc8;
  --panel:#eeece8;
  --success:#1a6b3c;
  --font-display:'Bebas Neue',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-ar:'IBM Plex Sans Arabic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-mono);min-height:100vh;overflow-x:hidden}
[dir="rtl"]{font-family:var(--font-ar)}
.hidden{display:none!important}

/* NOISE OVERLAY */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

/* TYPOGRAPHY */
h1,h2,h3,.brand{font-family:var(--font-display);letter-spacing:0.05em}
.brand{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1}
.mono{font-family:var(--font-mono)}

/* SCREENS */
.screen{position:fixed;inset:0;overflow-y:auto;z-index:10;transition:opacity .3s,transform .3s}
.screen.inactive{opacity:0;pointer-events:none;transform:translateY(8px)}

/* LOGIN */
#screen-login{background:var(--ink);display:flex;align-items:center;justify-content:center}
.login-box{background:var(--paper);padding:2.5rem;width:min(420px,95vw);border:2px solid var(--ink);position:relative}
.login-box::before{content:'';position:absolute;top:6px;left:6px;right:-6px;bottom:-6px;border:2px solid var(--ink);z-index:-1}
.crosshair{position:absolute;width:20px;height:20px;border-color:var(--red)}
.crosshair.tl{top:-2px;left:-2px;border-top:3px solid;border-left:3px solid}
.crosshair.br{bottom:-2px;right:-2px;border-bottom:3px solid;border-right:3px solid}

/* INPUTS */
input,select,textarea{
  width:100%;border:1.5px solid var(--border);background:white;
  padding:.6rem .8rem;font-family:var(--font-mono);font-size:.85rem;
  color:var(--ink);outline:none;transition:border-color .2s
}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] textarea{font-family:var(--font-ar);text-align:right}
label{display:block;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem;color:var(--mid)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;font-family:var(--font-mono);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:2px solid transparent;transition:all .15s}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover{background:var(--red);border-color:var(--red)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-secondary:hover{background:var(--ink);color:var(--paper)}
.btn-danger{background:var(--red);color:white;border-color:var(--red)}
.btn-danger:hover{background:#922b21;border-color:#922b21}
.btn-success{background:var(--success);color:white;border-color:var(--success)}
.btn-gold{background:var(--gold);color:white;border-color:var(--gold)}
.btn-sm{padding:.35rem .8rem;font-size:.7rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* TOP NAV */
#topnav{position:sticky;top:0;z-index:100;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;border-bottom:3px solid var(--red)}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav-tab{padding:.45rem 1rem;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;color:#aaa;white-space:nowrap;transition:all .15s}
.nav-tab.active{color:var(--paper);border-bottom-color:var(--red)}
.nav-tab:hover{color:var(--paper)}

/* CARDS */
.card{background:white;border:1.5px solid var(--border);padding:1.25rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1.5px solid var(--border)}
.card-title{font-size:1rem;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:.5rem}

/* STAT CARDS */
.stat-card{background:var(--ink);color:var(--paper);padding:1.25rem;border:2px solid var(--ink)}
.stat-val{font-family:var(--font-display);font-size:2.8rem;line-height:1;color:var(--red)}
.stat-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-top:.25rem}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:.2rem .55rem;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid}
.badge-active{color:var(--success);border-color:var(--success);background:#e8f5ee}
.badge-inactive{color:var(--red);border-color:var(--red);background:#fdf0ee}
.badge-pending{color:var(--gold);border-color:var(--gold);background:#fdf8e1}
.badge-complex{color:#7b2fbe;border-color:#7b2fbe;background:#f5edff}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:.5rem .8rem;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);border-bottom:2px solid var(--border);background:var(--panel)}
td{padding:.6rem .8rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--panel)}
[dir="rtl"] th,[dir="rtl"] td{text-align:right}

/* STARS */
.stars{display:flex;gap:2px}
.star{font-size:1.2rem;cursor:pointer;color:#ddd;transition:color .1s}
.star.filled{color:var(--gold)}
.star:hover,.star:hover~.star{color:#ddd}
.stars:hover .star{color:var(--gold)}
.stars .star:hover~.star{color:#ddd!important}

/* PROGRESS BAR */
.progress-bar{height:6px;background:var(--border);position:relative;overflow:hidden}
.progress-fill{height:100%;background:var(--ink);transition:width .6s}
.progress-fill.red{background:var(--red)}
.progress-fill.gold{background:var(--gold)}

/* ALERT BOX */
.alert{padding:.7rem 1rem;border-left:4px solid;font-size:.8rem;margin-bottom:.75rem}
.alert-info{border-color:#2980b9;background:#eaf4fb;color:#1a5276}
.alert-warn{border-color:var(--gold);background:#fdf8e1;color:#7d6608}
.alert-error{border-color:var(--red);background:#fdf0ee;color:#922b21}
.alert-success{border-color:var(--success);background:#e8f5ee;color:#1a6b3c}
[dir="rtl"] .alert{border-left:none;border-right:4px solid}

/* LANG TOGGLE */
.lang-btn{font-size:.7rem;font-weight:700;letter-spacing:.1em;cursor:pointer;padding:.3rem .6rem;border:1.5px solid #555;color:#ccc;background:transparent;transition:all .15s}
.lang-btn.active-lang{background:var(--red);border-color:var(--red);color:white}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--paper);border:2px solid var(--ink);width:min(560px,95vw);max-height:90vh;overflow-y:auto;position:relative}
.modal::after{content:'';position:absolute;top:8px;left:8px;right:-8px;bottom:-8px;border:2px solid var(--ink);z-index:-1;pointer-events:none}
.modal-header{background:var(--ink);color:var(--paper);padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:1.5rem}

/* PRINT RECEIPT */
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;position:static}
}
#print-area{display:none}

/* SIDEBAR PANEL */
.side-panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,95vw);background:white;border-left:2px solid var(--ink);z-index:150;transform:translateX(100%);transition:transform .3s;overflow-y:auto}
.side-panel.open{transform:translateX(0)}
[dir="rtl"] .side-panel{right:auto;left:0;border-left:none;border-right:2px solid var(--ink);transform:translateX(-100%)}
[dir="rtl"] .side-panel.open{transform:translateX(0)}

/* COMPLEXITY TAG */
.complexity-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid #7b2fbe;color:#7b2fbe;background:#f5edff}
.complexity-tag::before{content:'⬡';font-size:.8rem}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--border)}
::-webkit-scrollbar-thumb:hover{background:var(--mid)}

/* GRID */
.main-grid{display:grid;gap:1rem;padding:1rem}
@media(min-width:768px){.main-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.main-grid.cols3{grid-template-columns:repeat(3,1fr)}}
.col-span-2{grid-column:span 2}
.col-span-3{grid-column:span 3}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.animate-in{animation:fadeUp .3s ease forwards}
.pulse{animation:pulse 2s infinite}

/* RATING DISPLAY */
.rating-big{font-size:3rem;font-family:var(--font-display);color:var(--gold);line-height:1}

/* CATEGORY PILL */
.cat-pill{display:inline-flex;align-items:center;padding:.3rem .7rem;border:1.5px solid var(--ink);font-size:.7rem;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:all .15s;text-transform:uppercase}
.cat-pill:hover,.cat-pill.active{background:var(--ink);color:var(--paper)}

/* SCORE RING */
.score-ring{width:64px;height:64px;border-radius:50%;border:4px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.1rem;position:relative}

/* NOTIFICATION DOT */
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1.5s infinite}

/* SECTION DIVIDER */
.sec-divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.sec-divider::before,.sec-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-divider span{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);white-space:nowrap}
</style>
</head>

let currentLang = 'fr';
function t(key){return (i18n[currentLang]||i18n.fr)[key]||i18n.fr[key]||key}

function setLang(lang){
  currentLang=lang;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  ['lb-fr','lb-fr2'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.classList.toggle('active-lang',lang==='fr')}
  });
  ['lb-ar','lb-ar2'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.classList.toggle('active-lang',lang==='ar')}
  });
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    el.textContent=t(key);
  });
  if(appState.currentUser) renderApp();
}

const appState={
  currentUser:null,
  activeTab:null,
};

// =============================================
// AUTH
// =============================================
function doLogin(){
  const username=document.getElementById('login-user').value.trim();
  const password=document.getElementById('login-pass').value;
  const users=DB.get('users')||[];
  const user=users.find(u=>u.username===username&&u.password===password);
  const alertEl=document.getElementById('login-alert');
  
  if(!user){
    alertEl.className='alert alert-error';
    alertEl.textContent='Identifiant ou mot de passe incorrect.';
    alertEl.classList.remove('hidden');
    return;
  }
  if(!user.active){
    alertEl.className='alert alert-error';
    alertEl.textContent='Compte désactivé. Contactez votre administrateur.';
    alertEl.classList.remove('hidden');
    return;
  }
  appState.currentUser=user;
  alertEl.classList.add('hidden');
  showApp();
}

function doLogout(){
  appState.currentUser=null;
  appState.activeTab=null;
  document.getElementById('screen-login').classList.remove('inactive');
  document.getElementById('screen-app').classList.add('inactive');
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.getElementById('screen-login').classList.contains('inactive')){
    doLogin();
  }
});

// =============================================
// APP INIT
// =============================================
function showApp(){
  document.getElementById('screen-login').classList.add('inactive');
  document.getElementById('screen-app').classList.remove('inactive');
  renderApp();
}

function renderApp(){
  const user=appState.currentUser;
  document.getElementById('user-badge').textContent=user.name+(user.role==='admin'?' [ADMIN]':' [ENG]');
  
  const tabs = user.role==='admin'
    ? ['dashboard','engineers','projects','inventory','reports']
    : ['mytasks','logform','logistics','knowledge','profile'];
  
  const tabsEl=document.getElementById('nav-tabs');
  tabsEl.innerHTML='';
  tabs.forEach((tab,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-tab'+((!appState.activeTab&&i===0)||appState.activeTab===tab?' active':'');
    btn.textContent=t('tab.'+tab);
    btn.onclick=()=>switchTab(tab);
    tabsEl.appendChild(btn);
  });
  
  if(!appState.activeTab) appState.activeTab=tabs[0];
  renderTab(appState.activeTab);
}

function switchTab(tab){
  appState.activeTab=tab;
  document.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.classList.toggle('active',btn.textContent===t('tab.'+tab));
  });
  renderTab(tab);
}

function renderTab(tab){
  const el=document.getElementById('tab-content');
  el.innerHTML='';
  const renderers={
    dashboard:renderDashboard,
    engineers:renderEngineers,
    projects:renderProjects,
    inventory:renderInventory,
    reports:renderReports,
    mytasks:renderMyTasks,
    logform:renderLogForm,
    logistics:renderLogistics,
    knowledge:renderKnowledge,
    profile:renderProfile,
  };
  if(renderers[tab]) renderers[tab](el);
}

function markRead(id){

  renderTab('dashboard');
}

function markAllRead(){
  const alerts=DB.get('alerts')||[];
  alerts.forEach(a=>a.read=true);
  DB.set('alerts',alerts);
  renderTab('dashboard');
}

function runRecommendation(){
  const size=document.getElementById('rec-size').value;
  const net=document.getElementById('rec-net').value;
  const mobile=document.getElementById('rec-mobile').value;
  const users=DB.get('users')||[];
  
  const engineers=users.filter(u=>u.role==='engineer'&&u.active&&u.scores);
  
  const scored=engineers.map(eng=>{
    let score=0;
    const s=eng.scores;
    if(size==='large') score+=s.nvr_config*2+s.networking*2;
    else if(size==='medium') score+=s.ip_camera*1.5+s.nvr_config;
    else score+=s.ip_camera*2;
    if(net==='multi'||net==='bridge') score+=s.networking*2+s.nvr_config;
    if(mobile==='yes') score+=s.mobile_access*2;
    score+=eng.avgRating*10;
    return {...eng,matchScore:Math.round(score)};
  }).sort((a,b)=>b.matchScore-a.matchScore);
  
  const resultsEl=document.getElementById('rec-results');
  if(scored.length===0){resultsEl.innerHTML=`<div class="alert alert-warn">Aucun ingénieur actif disponible.</div>`;return;}
  
  const isComplex = size==='large'&&net!=='simple'&&mobile==='yes';
  
  resultsEl.innerHTML=`
    ${isComplex?`<div class="alert alert-info" style="margin-bottom:.75rem">
      <strong>⬡ INSTALLATION COMPLEXE DÉTECTÉE</strong> — 
      Ce projet nécessite une configuration multi-NVR bridgée via switcher réseau avec vue mobile unifiée. 
      L'ingénieur recommandé doit maîtriser le routage VLAN, le tunneling RTSP et la configuration de l'app de surveillance.
    </div>`:''}
    <div style="font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--mid);margin-bottom:.5rem">
      CLASSEMENT PAR COMPATIBILITÉ
    </div>
    ${scored.map((eng,i)=>`
      <div style="display:flex;align-items:center;gap:1rem;padding:.75rem;background:${i===0?'var(--ink)':'var(--panel)'};color:${i===0?'white':'var(--ink)'};margin-bottom:2px;border:1.5px solid ${i===0?'var(--red)':'var(--border)'}">
        <div style="font-family:var(--font-display);font-size:2rem;width:2.5rem;text-align:center;color:${i===0?'var(--red)':'var(--mid)'}">${i+1}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:.9rem">${eng.name}</div>
          <div style="font-size:.65rem;opacity:.7;margin-top:.15rem">
            📷 Cam:${eng.scores.ip_camera} · 📱 Mobile:${eng.scores.mobile_access} · 🌐 Net:${eng.scores.networking} · 🎞️ NVR:${eng.scores.nvr_config} · ⭐${eng.avgRating}
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--font-display);font-size:1.8rem;color:${i===0?'var(--red)':'var(--gold)'}">${eng.matchScore}</div>
          <div style="font-size:.6rem;opacity:.7">SCORE</div>
        </div>
        ${i===0?`<span style="background:var(--red);color:white;padding:.2rem .5rem;font-size:.6rem;font-weight:800;letter-spacing:.1em">RECOMMANDÉ</span>`:''}
      </div>
    `).join('')}
  `;
}

  if(!name||!username||!password){alert('Tous les champs sont requis');return;}

function toggleEngineerStatus(id){
  const users=DB.get('users')||[];

  if(!confirm(`Confirmer: ${action} le compte de ${u.name}?\n\nNote: L'historique et les données restent intacts.`)) return;
  u.active=!u.active;
  DB.set('users',users);

  if(appState.currentUser&&appState.currentUser.id===id){

  renderTab('engineers');
}

function updateProgress(id){

  showModal(`AVANCEMENT — ${p.name}`,`
    <div>

function saveProgress(id){
  const val=parseInt(document.getElementById('prog-val').value);
  const projects=DB.get('projects')||[];
  const p=projects.find(x=>x.id===id);
  if(p){p.progress=val;if(val===100)p.status='completed';}
  DB.set('projects',projects);
  closeModal();
  renderTab('projects');
}

function completeProject(id){
  const projects=DB.get('projects')||[];
  const p=projects.find(x=>x.id===id);
  if(p){p.progress=100;p.status='completed';}
  DB.set('projects',projects);
  closeModal();
  renderTab('projects');
}

function editProject(id){

}

function recalcScores(){
  const logs=DB.get('logs')||[];
  const users=DB.get('users')||[];
  const ratings=DB.get('ratings')||[];
  
  users.forEach(u=>{
    if(u.role!=='engineer') return;
    const engLogs=logs.filter(l=>l.engineerId===u.id);
    const scores={ip_camera:0,mobile_access:0,networking:0,nvr_config:0};
    engLogs.forEach(l=>{
      scores.ip_camera+=l.categories.ip_camera*5;
      scores.mobile_access+=l.categories.mobile_access*5;
      scores.networking+=l.categories.networking*5;
      scores.nvr_config+=l.categories.nvr_config*5;
    });
    u.scores=scores;
    u.totalJobs=engLogs.length;
    const engRatings=ratings.filter(r=>r.engineerId===u.id);
    if(engRatings.length>0){
      u.avgRating=Math.round(engRatings.reduce((s,r)=>s+r.average,0)/engRatings.length*10)/10;
    }
  });
  DB.set('users',users);
  renderTab('reports');
  showToast('Scores recalculés depuis les rapports.');
}

function addEquipToLog(sel){
  const val=sel.value;
  if(!val) return;
  if(val==='__custom__'){
    document.getElementById('lf-equip-custom').classList.remove('hidden');
    sel.value='';
    return;
  }
  window._logEquipment=window._logEquipment||[];
  if(!window._logEquipment.includes(val)){
    window._logEquipment.push(val);
    refreshEquipList();
  }
  sel.value='';
}

function refreshEquipList(){
  const list=document.getElementById('lf-equip-list');
  if(!list) return;
  list.innerHTML=(window._logEquipment||[]).map(e=>`
    <span style="display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;background:var(--ink);color:white;font-size:.65rem">
      ${e} <button onclick="removeEquip('${e}')" style="background:none;border:none;color:white;cursor:pointer;font-size:.8rem">✕</button>
    </span>
  `).join('');
}

function removeEquip(name){
  window._logEquipment=(window._logEquipment||[]).filter(e=>e!==name);
  refreshEquipList();
}

function submitLog(){
  const projId=document.getElementById('lf-proj').value;
  const date=document.getElementById('lf-date').value;
  const hours=parseInt(document.getElementById('lf-hours').value)||0;
  const notes=document.getElementById('lf-notes').value.trim();
  
  if(!projId){alert('Veuillez sélectionner un projet.');return;}
  if(!notes){alert('Veuillez ajouter des notes techniques.');return;}
  
  // Custom equip
  const customEquip=document.getElementById('lf-equip-custom').value.trim();
  if(customEquip&&!(window._logEquipment||[]).includes(customEquip)){
    window._logEquipment=window._logEquipment||[];
    window._logEquipment.push(customEquip);
  }
  
  const categories={
    ip_camera:parseInt(document.getElementById('lf-ip_camera').value)||0,
    mobile_access:parseInt(document.getElementById('lf-mobile_access').value)||0,
    networking:parseInt(document.getElementById('lf-networking').value)||0,
    nvr_config:parseInt(document.getElementById('lf-nvr_config').value)||0,
  };
  
  const log={
    id:uid(),
    engineerId:appState.currentUser.id,
    projectId:projId,
    date,hours,categories,
    equipment:window._logEquipment||[],
    notes,
    status:'submitted',
  };
  
  const logs=DB.get('logs')||[];
  logs.push(log);
  DB.set('logs',logs);
  
  // Auto-increment engineer scores
  const users=DB.get('users')||[];
  const user=users.find(u=>u.id===appState.currentUser.id);
  if(user){
    if(!user.scores) user.scores={ip_camera:0,mobile_access:0,networking:0,nvr_config:0};
    user.scores.ip_camera+=categories.ip_camera*5;
    user.scores.mobile_access+=categories.mobile_access*5;
    user.scores.networking+=categories.networking*5;
    user.scores.nvr_config+=categories.nvr_config*5;
    user.totalJobs=(user.totalJobs||0)+1;
    DB.set('users',users);
    appState.currentUser=user;
  }
  
  window._logEquipment=[];
  showToast('Rapport soumis avec succès! Scores mis à jour.');
  renderTab('logform');
}

  DB.set('alerts',alerts);
  document.getElementById('log-msg').value='';

  document.getElementById('urg-msg').value='';
  document.getElementById('urg-proj').value='';
  showToast('⚠️ Alerte urgente envoyée!');
  renderTab('logistics');
}

              <li>Flux absent: vérifier port forwarding + pare-feu NAT</li>
              <li>Latence élevée: activer compression H.265+ sur NVR</li>
              <li>App ne voit pas tous NVR: vérifier ports uniques par NVR</li>
              <li>Image floue nuit: régler WDR + BLC selon éclairage</li>
              <li>Switch saturé: vérifier bande passante PoE totale</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderKBItems(inventory,cat,catLabels){
  const items=inventory.filter(i=>i.category===cat);
  if(items.length===0) return `<div class="alert alert-info" style="grid-column:1/-1">Aucun équipement dans cette catégorie. L'admin peut en ajouter via l'inventaire.</div>`;
  return items.map(item=>`
    <div class="card animate-in" style="position:relative">
      <div style="font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--mid);margin-bottom:.3rem">${item.brand} · ${item.category.toUpperCase()}</div>
      <div style="font-weight:700;font-size:.9rem;margin-bottom:.25rem">${item.name}</div>
      <div style="font-size:.7rem;color:var(--mid);margin-bottom:.75rem;font-family:var(--font-mono)">${item.model}</div>
      ${item.notes?`<div style="font-size:.75rem;margin-bottom:.75rem;padding:.5rem;background:var(--panel);border-left:3px solid var(--border)">${item.notes}</div>`:''}
      <div style="display:flex;gap:.4rem">
        ${item.docUrl?`
          <a href="${item.docUrl}" target="_blank" class="btn btn-primary btn-sm" style="flex:1;justify-content:center;text-decoration:none">
            🔗 DOC OFFICIELLE
          </a>
        `:`<button class="btn btn-secondary btn-sm" style="flex:1;opacity:.4" disabled>DOC NON DISPONIBLE</button>`}
      </div>
    </div>
  `).join('');
}

function filterKB(cat,btn){
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const inventory=DB.get('inventory')||[];
  const catLabels={cameras:'📷 CAMÉRAS IP',nvrs:'🎞️ NVR / DVR',switches:'🌐 SWITCHES',routers:'🔌 ROUTEURS',accessories:'🔧 ACCESSOIRES'};
  document.getElementById('kb-grid').innerHTML=renderKBItems(inventory,cat,catLabels);
}

// =============================================
// ENGINEER: PROFILE + CLIENT RATING
// =============================================
function renderProfile(el){
  const user=appState.currentUser;
  const users=DB.get('users')||[];
  const fullUser=users.find(u=>u.id===user.id)||user;
  const ratings=DB.get('ratings')||[];
  const myRatings=ratings.filter(r=>r.engineerId===user.id);
  const avgRating=myRatings.length>0?
    Math.round(myRatings.reduce((s,r)=>s+r.average,0)/myRatings.length*10)/10:0;
  const s=fullUser.scores||{ip_camera:0,mobile_access:0,networking:0,nvr_config:0};
  
  el.innerHTML=`
  <div style="padding:1rem;max-width:700px">
    <h2 style="font-size:1.6rem;margin-bottom:1rem">MON PROFIL TERRAIN</h2>
    
    <div style="display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:start;margin-bottom:1.25rem">
      <!-- AVATAR + RATING -->
      <div style="text-align:center">
        <div style="width:80px;height:80px;background:var(--ink);border:4px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2.2rem;color:white;margin-bottom:.5rem">
          ${fullUser.name.split(' ').map(n=>n[0]).join('').slice(0,2)}
        </div>
        <div class="rating-big">${avgRating||'—'}</div>
        <div style="font-size:.6rem;color:var(--mid);letter-spacing:.08em">RATING MOYEN</div>
        <div style="margin-top:.25rem">${'★'.repeat(Math.round(avgRating))}${'☆'.repeat(5-Math.round(avgRating))}</div>
      </div>
      
      <div>
        <div style="font-size:1.3rem;font-weight:700">${fullUser.name}</div>
        <div style="font-size:.7rem;color:var(--mid);letter-spacing:.08em;margin-bottom:.75rem">@${fullUser.username} · ${fullUser.totalJobs||0} MISSIONS</div>
        
        <!-- SCORES -->
        ${[
          ['📷 Caméra IP',s.ip_camera,200],
          ['📱 Mobile/Remote',s.mobile_access,200],
          ['🌐 Réseau Avancé',s.networking,200],
          ['🎞️ Config NVR',s.nvr_config,200],
        ].map(([label,val,max])=>`
          <div style="margin-bottom:.6rem">
            <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:.2rem">
              <span style="font-weight:600">${label}</span>
              <span style="font-weight:800;font-family:var(--font-display);font-size:1rem">${val} <span style="font-size:.6rem;font-family:var(--font-mono);color:var(--mid)">pts</span></span>
            </div>
            <div class="progress-bar" style="height:8px">
              <div class="progress-fill" style="width:${Math.min(100,Math.round(val/max*100))}%;background:${val>150?'var(--success)':val>80?'var(--gold)':'var(--ink)'}"></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    
    <!-- CLIENT RATING MODULE -->
    <div class="card animate-in" style="border:2px solid var(--gold);margin-bottom:1rem">
      <div class="card-header" style="background:var(--ink);color:white">
        <div class="card-title" style="color:white">⭐ MODULE D'ÉVALUATION CLIENT</div>
        <span style="font-size:.65rem;color:#aaa">REMETTRE LE TÉLÉPHONE AU CLIENT</span>
      </div>
      <div id="rating-module">
        ${renderRatingModule()}
      </div>
    </div>
    
    <!-- RATING HISTORY -->
    <div class="card animate-in" style="animation-delay:.1s">
      <div class="card-header">
        <div class="card-title">📊 HISTORIQUE DES ÉVALUATIONS</div>
      </div>
      ${myRatings.length===0?`<p style="font-size:.8rem;color:var(--mid)">Aucune évaluation reçue</p>`:
      myRatings.map(r=>`
        <div style="display:flex;align-items:center;gap:1rem;padding:.6rem;border-bottom:1px solid var(--border)">
          <div style="font-size:1.8rem;font-family:var(--font-display);color:var(--gold)">${r.average}</div>
          <div style="flex:1">
            <div style="font-weight:600;font-size:.85rem">${r.clientName||'Client'}</div>
            <div style="font-size:.7rem;color:var(--mid)">
              Qualité: ${renderStarsDisplay(r.quality)} · Rapidité: ${renderStarsDisplay(r.speed)} · ${r.date}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderStarsDisplay(n){
  return '★'.repeat(n)+'☆'.repeat(5-n);
}

function renderRatingModule(){
  const user=appState.currentUser;
  const projects=DB.get('projects')||[];
  const myProjects=projects.filter(p=>p.assignedTo===user.id);
  
  return `
    <div style="padding:1.25rem">
      <div style="font-size:.8rem;margin-bottom:1rem;text-align:center;color:var(--mid)">
        Veuillez évaluer la prestation de votre technicien
      </div>
      
      <div style="margin-bottom:1rem">
        <label>PROJET CONCERNÉ</label>
        <select id="rating-proj">
          <option value="">-- Sélectionner --</option>
          ${myProjects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
      
      <div style="margin-bottom:1rem">
        <label style="text-align:center;display:block;margin-bottom:.6rem">QUALITÉ DU TRAVAIL</label>
        <div class="stars" id="stars-quality" style="justify-content:center;font-size:2rem" data-val="0">
          ${[1,2,3,4,5].map(i=>`<span class="star" data-n="${i}" onclick="setStar('quality',${i})">★</span>`).join('')}
        </div>
      </div>
      
      <div style="margin-bottom:1.25rem">
        <label style="text-align:center;display:block;margin-bottom:.6rem">RAPIDITÉ D'EXÉCUTION</label>
        <div class="stars" id="stars-speed" style="justify-content:center;font-size:2rem" data-val="0">
          ${[1,2,3,4,5].map(i=>`<span class="star" data-n="${i}" onclick="setStar('speed',${i})">★</span>`).join('')}
        </div>
      </div>
      
      <div style="margin-bottom:1rem">
        <label>VOTRE NOM (optionnel)</label>
        <input type="text" id="rating-client" placeholder="M. Nom Client"/>
      </div>
      
      <button class="btn btn-gold" style="width:100%;justify-content:center;font-size:.9rem" onclick="submitRating()">
        ✓ VALIDER L'ÉVALUATION
      </button>
    </div>
  `;
}

window._ratingVals={quality:0,speed:0};

function setStar(type,n){
  window._ratingVals=window._ratingVals||{quality:0,speed:0};
  window._ratingVals[type]=n;
  const container=document.getElementById(`stars-${type}`);
  if(container){
    container.querySelectorAll('.star').forEach((star,i)=>{
      star.style.color=i<n?'var(--gold)':'#ddd';
    });
  }
}

function submitRating(){
  const projId=document.getElementById('rating-proj').value;
  const quality=window._ratingVals.quality;
  const speed=window._ratingVals.speed;
  if(!projId){alert('Sélectionnez un projet');return;}
  if(!quality||!speed){alert('Veuillez noter les 2 critères');return;}
  
  const clientName=document.getElementById('rating-client').value||'Client';
  const average=Math.round((quality+speed)/2*10)/10;
  
  const ratings=DB.get('ratings')||[];
  ratings.push({id:uid(),engineerId:appState.currentUser.id,projectId:projId,quality,speed,average,date:now(),clientName});
  DB.set('ratings',ratings);
  
  // Update engineer avg
  const users=DB.get('users')||[];
  const u=users.find(x=>x.id===appState.currentUser.id);
  if(u){
    const myR=ratings.filter(r=>r.engineerId===u.id);
    u.avgRating=Math.round(myR.reduce((s,r)=>s+r.average,0)/myR.length*10)/10;
    DB.set('users',users);
    appState.currentUser=u;
  }
  
  window._ratingVals={quality:0,speed:0};
  showToast(`⭐ Évaluation ${average}/5 enregistrée. Merci!`);
  renderTab('profile');
}

function openRating(projectId){
  const user=appState.currentUser;
  showModal('⭐ ÉVALUATION CLIENT',`
    <div>
      <div style="font-size:.8rem;margin-bottom:1rem;text-align:center;background:var(--panel);padding:.75rem">
        Remettez le téléphone au client pour qu'il évalue la prestation.
      </div>
      <div style="margin-bottom:1rem">
        <label style="text-align:center;display:block;margin-bottom:.6rem">QUALITÉ DU TRAVAIL</label>
        <div class="stars" id="stars-quality" style="justify-content:center;font-size:2.5rem">
          ${[1,2,3,4,5].map(i=>`<span class="star" data-n="${i}" onclick="setStar('quality',${i})">★</span>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:1.25rem">
        <label style="text-align:center;display:block;margin-bottom:.6rem">RAPIDITÉ D'EXÉCUTION</label>
        <div class="stars" id="stars-speed" style="justify-content:center;font-size:2.5rem">
          ${[1,2,3,4,5].map(i=>`<span class="star" data-n="${i}" onclick="setStar('speed',${i})">★</span>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:1rem">
        <label>NOM DU CLIENT</label>
        <input type="text" id="rating-client" placeholder="M. / Mme..."/>
      </div>
      <input type="hidden" id="rating-proj" value="${projectId}"/>
      <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="submitRating();closeModal()">✓ VALIDER</button>
    </div>
  `);
  window._ratingVals={quality:0,speed:0};
}

// =============================================
// MODAL HELPERS
// =============================================
function showModal(title, body){
  document.getElementById('modal-title-text').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
}

function closeModalOverlay(e){
  if(e.target===document.getElementById('modal-overlay')) closeModal();
}

// SIDE PANEL
function openSidePanel(title,body){
  document.getElementById('side-panel-title').textContent=title;
  document.getElementById('side-panel-body').innerHTML=body;
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('side-overlay').classList.remove('hidden');
}

function closeSidePanel(){
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('side-overlay').classList.add('hidden');
}

// TOAST
function showToast(msg){
  const existing=document.getElementById('toast-el');
  if(existing) existing.remove();
  const t=document.createElement('div');
  t.id='toast-el';
  t.style.cssText='position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:.7rem 1.25rem;font-size:.8rem;font-weight:600;z-index:999;border-left:4px solid var(--red);max-width:90vw;animation:fadeUp .3s ease';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
