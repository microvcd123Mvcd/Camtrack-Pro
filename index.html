<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="description" content="CAMTRACK PRO - Professional CCTV Installation Management"/>
<title>CAMTRACK PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --ink:#0a0a0a;
  --paper:#f5f3ef;
  --red:#c0392b;
  --gold:#b8960c;
  --mid:#6b6b6b;
  --border:#d0cdc8;
  --panel:#eeece8;
  --success:#1a6b3c;
  --font-display:'Bebas Neue',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-ar:'IBM Plex Sans Arabic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-mono);min-height:100vh;overflow-x:hidden}
[dir="rtl"]{font-family:var(--font-ar)}
.hidden{display:none!important}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

h1,h2,h3,.brand{font-family:var(--font-display);letter-spacing:0.05em}
.brand{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1}
.mono{font-family:var(--font-mono)}

.screen{position:fixed;inset:0;overflow-y:auto;z-index:10;transition:opacity .3s,transform .3s}
.screen.inactive{opacity:0;pointer-events:none;transform:translateY(8px)}

#screen-login{background:var(--ink);display:flex;align-items:center;justify-content:center}
.login-box{background:var(--paper);padding:2.5rem;width:min(420px,95vw);border:2px solid var(--ink);position:relative}
.login-box::before{content:'';position:absolute;top:6px;left:6px;right:-6px;bottom:-6px;border:2px solid var(--ink);z-index:-1}
.crosshair{position:absolute;width:20px;height:20px;border-color:var(--red)}
.crosshair.tl{top:-2px;left:-2px;border-top:3px solid;border-left:3px solid}
.crosshair.br{bottom:-2px;right:-2px;border-bottom:3px solid;border-right:3px solid}

input,select,textarea{
  width:100%;border:1.5px solid var(--border);background:white;
  padding:.6rem .8rem;font-family:var(--font-mono);font-size:.85rem;
  color:var(--ink);outline:none;transition:border-color .2s
}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] textarea{font-family:var(--font-ar);text-align:right}
label{display:block;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem;color:var(--mid)}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;font-family:var(--font-mono);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:2px solid transparent;transition:all .15s}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover{background:var(--red);border-color:var(--red)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-secondary:hover{background:var(--ink);color:var(--paper)}
.btn-danger{background:var(--red);color:white;border-color:var(--red)}
.btn-danger:hover{background:#922b21;border-color:#922b21}
.btn-success{background:var(--success);color:white;border-color:var(--success)}
.btn-gold{background:var(--gold);color:white;border-color:var(--gold)}
.btn-sm{padding:.35rem .8rem;font-size:.7rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

#topnav{position:sticky;top:0;z-index:100;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;border-bottom:3px solid var(--red)}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav-tab{padding:.45rem 1rem;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;color:#aaa;white-space:nowrap;transition:all .15s}
.nav-tab.active{color:var(--paper);border-bottom-color:var(--red)}
.nav-tab:hover{color:var(--paper)}

.card{background:white;border:1.5px solid var(--border);padding:1.25rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1.5px solid var(--border)}
.card-title{font-size:1rem;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:.5rem}

.stat-card{background:var(--ink);color:var(--paper);padding:1.25rem;border:2px solid var(--ink)}
.stat-val{font-family:var(--font-display);font-size:2.8rem;line-height:1;color:var(--red)}
.stat-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-top:.25rem}

.badge{display:inline-flex;align-items:center;padding:.2rem .55rem;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid}
.badge-active{color:var(--success);border-color:var(--success);background:#e8f5ee}
.badge-inactive{color:var(--red);border-color:var(--red);background:#fdf0ee}
.badge-pending{color:var(--gold);border-color:var(--gold);background:#fdf8e1}
.badge-complex{color:#7b2fbe;border-color:#7b2fbe;background:#f5edff}

table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:.5rem .8rem;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);border-bottom:2px solid var(--border);background:var(--panel)}
td{padding:.6rem .8rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--panel)}
[dir="rtl"] th,[dir="rtl"] td{text-align:right}

.stars{display:flex;gap:2px}
.star{font-size:1.2rem;cursor:pointer;color:#ddd;transition:color .1s}
.star.filled{color:var(--gold)}

.progress-bar{height:6px;background:var(--border);position:relative;overflow:hidden}
.progress-fill{height:100%;background:var(--ink);transition:width .6s}

.alert{padding:.7rem 1rem;border-left:4px solid;font-size:.8rem;margin-bottom:.75rem}
.alert-info{border-color:#2980b9;background:#eaf4fb;color:#1a5276}
.alert-warn{border-color:var(--gold);background:#fdf8e1;color:#7d6608}
.alert-error{border-color:var(--red);background:#fdf0ee;color:#922b21}
.alert-success{border-color:var(--success);background:#e8f5ee;color:#1a6b3c}
[dir="rtl"] .alert{border-left:none;border-right:4px solid}

.lang-btn{font-size:.7rem;font-weight:700;letter-spacing:.1em;cursor:pointer;padding:.3rem .6rem;border:1.5px solid #555;color:#ccc;background:transparent;transition:all .15s}
.lang-btn.active-lang{background:var(--red);border-color:var(--red);color:white}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--paper);border:2px solid var(--ink);width:min(560px,95vw);max-height:90vh;overflow-y:auto;position:relative}
.modal-header{background:var(--ink);color:var(--paper);padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:1.5rem}

#boot-screen {
  position:fixed;inset:0;background:#0a0a0a;color:white;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
}

.side-panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,95vw);background:white;border-left:2px solid var(--ink);z-index:150;transform:translateX(100%);transition:transform .3s;overflow-y:auto}
.side-panel.open{transform:translateX(0)}
[dir="rtl"] .side-panel{right:auto;left:0;border-left:none;border-right:2px solid var(--ink);transform:translateX(-100%)}
[dir="rtl"] .side-panel.open{transform:translateX(0)}

.complexity-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid #7b2fbe;color:#7b2fbe;background:#f5edff}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;}

.sec-divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.sec-divider::before,.sec-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-divider span{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);white-space:nowrap}
</style>
</head>
<body>

<div id="boot-screen">
  <svg width="50" height="50" viewBox="0 0 36 36" fill="none" class="animate-spin">
    <circle cx="18" cy="18" r="14" stroke="#c0392b" stroke-width="3" stroke-dasharray="60 30" fill="none"/>
  </svg>
  <div style="font-family:var(--font-display);font-size:1.5rem;letter-spacing:0.1em;" id="boot-text">BOOTING CAMTRACK PRO...</div>
</div>

<div id="screen-login" class="screen">
  <div class="login-box">
    <div class="crosshair tl"></div>
    <div class="crosshair br"></div>
    
    <div style="display:flex;gap:.4rem;margin-bottom:1.5rem;justify-content:flex-end">
      <button class="lang-btn active-lang" onclick="setLang('fr')" id="lb-fr">FR</button>
      <button class="lang-btn" onclick="setLang('ar')" id="lb-ar">ع</button>
    </div>

    <div style="margin-bottom:2rem">
      <div style="display:flex;align-items:center;gap:.6rem">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" fill="#0a0a0a"/>
          <circle cx="18" cy="18" r="10" stroke="#c0392b" stroke-width="2" fill="none"/>
          <circle cx="18" cy="18" r="3" fill="#c0392b"/>
        </svg>
        <div>
          <div class="brand" style="color:var(--ink)">CAMTRACK</div>
          <div style="font-size:.65rem;letter-spacing:.25em;color:var(--red);font-weight:700;margin-top:-4px">PRO // GESTION COGNITIVE</div>
        </div>
      </div>
    </div>

    <div id="login-alert" class="hidden"></div>

    <div style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label data-i18n="login.user">IDENTIFIANT</label>
        <input type="text" id="login-user" placeholder="admin ou karim"/>
      </div>
      <div>
        <label data-i18n="login.pass">MOT DE PASSE</label>
        <input type="password" id="login-pass" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem" onclick="doLogin()">
        <span data-i18n="login.btn">CONNEXION</span>
      </button>
    </div>
  </div>
</div>

<div id="screen-app" class="screen inactive">
  <div id="topnav">
    <div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0">
      <span class="brand" style="color:white;font-size:1.2rem">CAMTRACK PRO</span>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
    <div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0">
      <button class="lang-btn" onclick="setLang('fr')" id="lb-fr2">FR</button>
      <button class="lang-btn" onclick="setLang('ar')" id="lb-ar2">ع</button>
      <div style="font-size:.7rem;color:#aaa" id="user-badge"></div>
      <button class="btn btn-sm" style="background:#c0392b;color:white" onclick="doLogout()">DÉCO</button>
    </div>
  </div>
  <div id="tab-content" style="padding:1rem"></div>
</div>

<script>
const i18n = {
  fr:{
    'login.user':'IDENTIFIANT',
    'login.pass':'MOT DE PASSE',
    'login.btn':'CONNEXION',
    'tab.dashboard':'TABLEAU DE BORD',
    'tab.engineers':'INGÉNIEURS',
    'tab.projects':'PROJETS',
    'tab.inventory':'INVENTAIRE',
    'tab.mytasks':'MES TÂCHES',
    'tab.logform':'RAPPORT JOURNALIER',
    'tab.knowledge':'NOTICES TECHNIQUE'
  },
  ar:{
    'login.user':'اسم المستخدم',
    'login.pass':'كلمة المرور',
    'login.btn':'تسجيل الدخول',
    'tab.dashboard':'لوحة التحكم',
    'tab.engineers':'المهندسون',
    'tab.projects':'المشاريع',
    'tab.inventory':'المخزون',
    'tab.mytasks':'مهامي',
    'tab.logform':'تقرير يومي',
    'tab.knowledge':'الدليل التقني'
  }
};

let currentLang = 'fr';
function t(key){ return i18n[currentLang][key] || i18n['fr'][key] || key; }

function setLang(lang){
  currentLang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent=t(el.getAttribute('data-i18n'));
  });
  if(appState.currentUser) renderApp();
}

const DB = {
  get(key){ return JSON.parse(localStorage.getItem('ctp_'+key)) },
  set(key,val){ localStorage.setItem('ctp_'+key,JSON.stringify(val)) }
};

function initDB(){
  if(!localStorage.getItem('ctp_initialized')){
    DB.set('users',[
      {id:'u001',username:'admin',password:'admin123',role:'admin',name:'Walid Sahli (Admin)',active:true},
      {id:'u002',username:'karim',password:'karim123',role:'engineer',name:'Karim Technicien',active:true,scores:{ip_camera:40,mobile_access:20,networking:30,nvr_config:25},avgRating:4.8}
    ]);
    DB.set('projects',[
      {id:'p001',name:'Chantier Grand Parc Sousse',client:'Hôtel Sahel',status:'active',cameras:45,nvr_count:3,complex:true,assignedTo:'u002',progress:60}
    ]);
    DB.set('inventory',[
      {id:'i001',brand:'Hikvision',model:'DS-2CD2143G2-I',category:'cameras',qty:22,docUrl:'https://www.hikvision.com'},
      {id:'i002',brand:'Dahua',model:'NVR5216-16P-I/E',category:'nvrs',qty:4,docUrl:'https://www.dahuasecurity.com'}
    ]);
    DB.set('ratings',[]);
    localStorage.setItem('ctp_initialized','true');
  }
}

const appState={ currentUser:null, activeTab:null };

function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  const users=DB.get('users')||[];
  const found=users.find(x=>x.username===u && x.password===p);
  
  if(!found || !found.active){
    alert('Accès refusé / Identifiants incorrects');
    return;
  }
  appState.currentUser=found;
  document.getElementById('screen-login').classList.add('inactive');
  document.getElementById('screen-app').classList.remove('inactive');
  renderApp();
}

function doLogout(){
  appState.currentUser=null;
  appState.activeTab=null;
  document.getElementById('screen-login').classList.remove('inactive');
  document.getElementById('screen-app').classList.add('inactive');
}

function renderApp(){
  const user=appState.currentUser;
  document.getElementById('user-badge').textContent=user.name;
  const tabs = user.role==='admin' ? ['dashboard','engineers','projects','inventory'] : ['mytasks','logform','knowledge'];
  
  const tabsEl=document.getElementById('nav-tabs');
  tabsEl.innerHTML='';
  tabs.forEach(tab=>{
    const b=document.createElement('button');
    b.className='nav-tab' + (appState.activeTab===tab?' active':'');
    b.textContent=t('tab.'+tab);
    b.onclick=()=>{ appState.activeTab=tab; renderApp(); };
    tabsEl.appendChild(b);
  });
  if(!appState.activeTab) appState.activeTab=tabs[0];
  
  const contentEl=document.getElementById('tab-content');
  if(appState.activeTab==='dashboard') renderDashboard(contentEl);
  if(appState.activeTab==='engineers') renderEngineers(contentEl);
  if(appState.activeTab==='projects') renderProjects(contentEl);
  if(appState.activeTab==='inventory') renderInventory(contentEl);
  if(appState.activeTab==='mytasks') renderMyTasks(contentEl);
  if(appState.activeTab==='logform') renderLogForm(contentEl);
  if(appState.activeTab==='knowledge') renderKnowledge(contentEl);
}

// ---- PAGES ADMIN ----
function renderDashboard(el){
  const prj=DB.get('projects')||[];
  const users=DB.get('users')||[];
  el.innerHTML=`
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="stat-card"><div class="stat-val">${prj.length}</div><div class="stat-label">Chantiers Totaux</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--gold)">${users.filter(x=>x.role==='engineer').length}</div><div class="stat-label">Techniciens</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#7b2fbe">${prj.filter(x=>x.complex).length}</div><div class="stat-label">Chantiers > 40 Caméras</div></div>
    </div>
    <div class="card">
      <h3 class="card-title mb-4">🤖 Moteur de Recommandation Algorithmique</h3>
      <p class="text-xs mb-4 text-gray-500">Analyse automatique les scores des ingénieurs pour attribuer les gros chantiers réseau.</p>
      <button class="btn btn-primary" onclick="runRec()">Calculer l'ingénieur idéal pour parc complexe</button>
      <div id="rec-res" class="mt-4 font-bold text-sm"></div>
    </div>
  `;
}

function runRec(){
  const engs=DB.get('users').filter(x=>x.role==='engineer');
  if(engs.length>0){
    document.getElementById('rec-res').innerHTML=`✨ Technicien recommandé : <span class="text-green-700">${engs[0].name}</span> (Score IP & Réseau Élevé ✅)`;
  }
}

function renderEngineers(el){
  const users=DB.get('users')||[];
  el.innerHTML=`
    <div class="card">
      <div class="flex justify-between items-center mb-4">
        <h3 class="card-title">👥 Gestion Centralisée de l'Équipe</h3>
      </div>
      <table class="w-full">
        <thead><tr><th>Nom</th><th>Rôle</th><th>Statut</th><th>Actions Admin</th></tr></thead>
        <tbody>
          ${users.map(u=>`
            <tr>
              <td>${u.name}</td>
              <td>${u.role}</td>
              <td><span class="badge ${u.active?'badge-active':'badge-inactive'}">${u.active?'Actif':'Révoqué'}</span></td>
              <td>
                ${u.role!=='admin'?`<button class="btn btn-sm btn-danger" onclick="toggleUser('${u.id}')">${u.active?'Désactiver (Bloquer Accès)':'Réactiver'}</button>`:'--'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <p class="text-xs text-red-600 mt-4">⚠️ Sécurité : La désactivation coupe l'accès instantanément mais préserve l'historique de l'entreprise.</p>
    </div>
  `;
}

function toggleUser(id){
  const users=DB.get('users');
  const u=users.find(x=>x.id===id);
  if(u) u.active = !u.active;
  DB.set('users',users);
  renderApp();
}

function renderProjects(el){
  const prj=DB.get('projects')||[];
  el.innerHTML=`
    <div class="card">
      <h3 class="card-title mb-4">📋 Suivi des Chantiers Réseau</h3>
      ${prj.map(p=>`
        <div class="p-3 border mb-2 bg-gray-50">
          <div class="flex justify-between mb-2"><strong>${p.name}</strong> <span class="complexity-tag">Architecture Multi-NVR (${p.cameras} cams)</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%; background:var(--red)"></div></div>
          <div class="text-xs text-gray-500 mt-1">${p.progress}% réalisé · Vision Smartphone Unifiée via Switch</div>
        </div>
      `).join('')}
    </div>`;
}

function renderInventory(el){
  const inv=DB.get('inventory')||[];
  el.innerHTML=`
    <div class="card">
      <h3 class="card-title mb-4">📦 Gestion Simplifiée du Stock</h3>
      <table class="w-full">
        <thead><tr><th>Marque</th><th>Modèle</th><th>Quantité</th><th>Lien Fiche Technique</th></tr></thead>
        <tbody>
          ${inv.map(i=>`<tr><td>${i.brand}</td><td>${i.model}</td><td>${i.qty}</td><td><a href="${i.docUrl}" target="_blank" class="text-blue-600 underline text-xs">Ouvrir Notice Constructeur ↗</a></td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

// ---- PAGES TECHNICIENS ----
function renderMyTasks(el){
  const prj=DB.get('projects')||[];
  el.innerHTML=`
    <div class="card">
      <h3 class="card-title mb-4">🛠️ Mes Interventions affectées</h3>
      ${prj.map(p=>`
        <div class="p-4 border border-black mb-4 bg-white">
          <div class="font-bold text-lg">${p.name}</div>
          <p class="text-xs text-purple-800 font-bold my-2">⚠️ CONFIGURATION RECOMMANDÉE : Plus de 40 Caméras. Interconnexion des NVR via Switch centralisé vers Modem Client.</p>
          <button class="btn btn-sm btn-secondary mt-2" onclick="alert('Impression du reçu via Bluetooth portable...')">🖨️ Imprimer Reçu Bluetooth</button>
        </div>
      `).join('')}
    </div>`;
}

function renderLogForm(el){
  el.innerHTML=`
    <div class="card">
      <h3 class="card-title mb-4">✍️ Soumettre le Rapport d'Intervention</h3>
      <div class="space-y-3">
        <div><label>Heures passées sur l'installation Caméras IP</label><input type="number" value="4"/></div>
        <div><label>Notes techniques de configuration</label><textarea placeholder="Ajustement VLAN Switch et flux vidéo unifié..."></textarea></div>
        
        <div class="sec-divider"><span>⭐ Évaluation Client (Fin de Chantier)</span></div>
        <p class="text-xs text-gray-500 mb-2">Passez le téléphone au client pour validation :</p>
        <div class="flex gap-4 items-center">
          <div><span class="text-xs font-bold">Qualité du travail :</span><div class="stars"><span class="star filled">★</span><span class="star filled">★</span><span class="star filled">★</span><span class="star filled">★</span><span class="star filled">★</span></div></div>
